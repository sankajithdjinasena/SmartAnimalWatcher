{% extends "layout.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div style="font-size: 2.8rem; margin-bottom: 8px;">🔑</div>
            <h2>Reset Password</h2>
            <p>Enter your registered phone number or email to reset your security password.</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label class="form-label">Registered Phone Number or Email</label>
                <input type="text" name="identifier" class="form-input" placeholder="e.g. 0771234567 or owner@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-input" placeholder="Re-enter new password" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem; margin-top: 10px;">
                Reset Password & Continue
            </button>
        </form>

        <div class="auth-footer">
            Remember your credentials? <a href="{{ url_for('login') }}" style="font-weight: 600;">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
